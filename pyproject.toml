[project]
name = "phantom-privacy"
version = "0.1.0"
description = "A Toolkit for Auditing Cross-User PII Leakage in Fine-Tuned LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Marc Ziegler", email = "marc.ziegler@tum.de"},
    {name = "Fatima Zahra Errounda"},
]
keywords = [
    "privacy-auditing",
    "large-language-models",
    "pii-leakage",
    "cross-user-leakage",
    "phantom-users",
    "llm",
    "security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.11.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "bitsandbytes>=0.43.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
    "dp-accounting>=0.4.0",
    "gliner>=0.2.28",
    "glirel>=1.2.1",
    "loguru>=0.7.0",
    "spacy>=3.8.0",
    "stanza>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
preprocess = "preprocess:main"
train = "train:main"
visualize = "visualize:main"
extract_pii_graph = "extract_pii_graph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

# ---------------------------------------------------------------------------
# Ruff (linting & formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    "legacy/",
    "figures/",
    "cluster-docs/",
    "docs/",
    ".drawio-tmp/",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy (type checking)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
markers = [
    "slow: tests that require heavy models or long runtimes",
]

# ---------------------------------------------------------------------------
# Dependency sources
# ---------------------------------------------------------------------------
# Use the PyTorch CUDA 11.8 wheel index so that uv.lock resolves torch to a
# wheel compatible with the cluster NVIDIA driver.
[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"

[tool.uv.sources]
torch = { index = "pytorch-cu118" }

# ---------------------------------------------------------------------------
# Dependency groups
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "python-dotenv>=1.0.0",
]
